name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            executable: generate-project-kanban-linux-x64
          - target: darwin-x64
            runner: macos-13
            executable: generate-project-kanban-darwin-x64
          - target: darwin-arm64
            runner: macos-14
            executable: generate-project-kanban-darwin-arm64
          - target: windows-x64
            runner: windows-latest
            executable: generate-project-kanban-windows-x64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package version matches tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(bun -e "console.log((await Bun.file('package.json').json()).version)")"
          test "$package_version" = "$version"

      - name: Validate source
        run: bun run release:check

      - name: Build release executable
        shell: bash
        run: |
          mkdir -p dist/release
          bun build src/index.tsx \
            --compile \
            --target=bun-${{ matrix.target }} \
            --outfile "dist/release/${{ matrix.executable }}"
          checksum="$(bun -e "const bytes = await Bun.file('dist/release/${{ matrix.executable }}').arrayBuffer(); const hash = await crypto.subtle.digest('SHA-256', bytes); console.log([...new Uint8Array(hash)].map(byte => byte.toString(16).padStart(2, '0')).join(''))")"
          printf '%s  %s\n' "$checksum" "${{ matrix.executable }}" > "dist/release/${{ matrix.executable }}.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
